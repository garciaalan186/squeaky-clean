name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Pin Node so the JS test-runner tests are deterministic. The runner
      # invokes `node --test`; leaving the version to the runner image's
      # ambient Node caused failures when it shipped Node 22+ (changed
      # directory-arg and default-reporter behaviour). Node 20 LTS matches
      # local dev; the runner code is verified on Node 20/22/24.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # R5.9: pin the JDK too — the java compiler/runner tests and the
      # micro-eval javac gate must not float with the runner image.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install (dev extras)
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check squeaky_clean tests

      - name: Type-check (mypy --strict)
        run: mypy --strict squeaky_clean

      # Fast-failing guards first: pattern/spec drift + the self-conformance
      # ratchet. These are also part of the full suite below, but running them
      # up front gives a clear signal when a spec or the framework's own
      # architecture regresses.
      - name: Drift guards + self-conformance ratchet
        run: |
          pytest -q \
            tests/self_conformance \
            tests/interface/test_architect_pattern_catalog.py \
            tests/application/use_cases/test_pattern_emitter_resolution.py \
            tests/eval/test_golden_squib_routing.py

      # Full unit suite. Live LLM tests (marker: integration) are excluded by
      # the default addopts in pyproject.toml and stay opt-in.
      - name: Unit test suite
        run: pytest -q

      # R5.7: $0 end-to-end eval gate. Replays P0 from the committed cache
      # bundle — the full pipeline (parse, routing, emission, integration,
      # generated-project pytest, scoring) runs with every LLM call served
      # from disk. Any prompt/spec drift surfaces as a loud
      # ReplayCacheMissError; harness regressions surface as score changes.
      # No API key needed or used.
      - name: Eval replay gate (P0, $0)
        env:
          SQUEAKY_CACHE_DIR: ${{ github.workspace }}/tests/ci_replay_cache
        run: |
          python -m squeaky_clean.interface.cli --problem P0 --replay-only
